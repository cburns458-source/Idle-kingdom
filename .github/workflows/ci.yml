name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: React app (lint, tests, parity fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Fails if the Dart row models drift from src/game/data/types.ts.
      - run: npm run gen:dart:check
      # Also asserts committed parity fixtures still match the TypeScript rules.
      - run: npm test

  dart:
    name: Dart packages (analyze, format, parity replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed packages
      - run: dart test packages/ik_parity packages/ik_rules packages/ik_content
