name: Deploy Worker (main)

# restoriaidle.com follows the main branch. Uses the top-level Wrangler
# config (no --env), which is the existing restoria-idlerpg Worker.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  production:
    name: restoria-idlerpg
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77df1b8f6f00664859462a7a8b4441f5
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy main Worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Live Worker deploy skipped::Set the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts Edit) to deploy restoria-idlerpg."
            exit 1
          fi
          npx --yes wrangler@4.148.0 deploy
