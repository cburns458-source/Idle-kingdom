name: Deploy Worker (main)

# restoriaidle.com follows the main branch. Always use --env production so
# bare `wrangler deploy` (top-level sink Worker) cannot overwrite live.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  production:
    name: restoria-idlerpg
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77df1b8f6f00664859462a7a8b4441f5
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      APP_BUILD: ${{ github.sha }}
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm environment
        run: |
          echo "supabase_url_set=$([ -n "$SUPABASE_URL" ] && echo yes || echo no)"
          echo "anon_key_set=$([ -n "$SUPABASE_ANON_KEY" ] && echo yes || echo no)"
          echo "supabase_url_chars=${#SUPABASE_URL}"
          echo "anon_key_chars=${#SUPABASE_ANON_KEY}"

      - name: Deploy main Worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Live Worker deploy skipped::Set the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts Edit) to deploy restoria-idlerpg."
            exit 1
          fi
          npm run deploy:production
