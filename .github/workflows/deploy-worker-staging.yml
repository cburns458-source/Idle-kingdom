name: Deploy Worker (test-launch)

# test.restoriaidle.com follows the test-launch branch. Never runs
# `wrangler deploy` without --env staging, so it cannot publish to
# restoria-idlerpg / restoriaidle.com.

on:
  push:
    branches: [test-launch]
  workflow_dispatch:

concurrency:
  group: worker-staging
  cancel-in-progress: false

jobs:
  staging:
    name: restoria-idlerpg-staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77df1b8f6f00664859462a7a8b4441f5
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm tester key secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Test Worker deploy skipped::Set the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts Edit + Zone DNS Edit) to deploy restoria-idlerpg-staging."
            exit 1
          fi
          # Names only. Never print secret values.
          list="$(npx --yes wrangler@4.148.0 secret list --env staging --json)"
          if ! printf '%s' "$list" | grep -q '"TESTER_PASSKEY"'; then
            echo "::error title=Missing TESTER_PASSKEY::Set a Secret named TESTER_PASSKEY on Worker restoria-idlerpg-staging in the Cloudflare dashboard. It must be a Secret, not a Variable, and not a GitHub secret."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Confirm environment
        run: |
          echo "supabase_url_set=$([ -n "$SUPABASE_URL" ] && echo yes || echo no)"
          echo "anon_key_set=$([ -n "$SUPABASE_ANON_KEY" ] && echo yes || echo no)"
          echo "supabase_url_chars=${#SUPABASE_URL}"
          echo "anon_key_chars=${#SUPABASE_ANON_KEY}"

      - name: Deploy test-launch Worker
        run: npx --yes wrangler@4.148.0 deploy --env staging

      - name: Confirm gate is asking for the key
        run: |
          code="$(curl -sS -o /tmp/gate.html -w '%{http_code}' https://restoria-idlerpg-staging.cburns458.workers.dev/)"
          echo "gate_status=$code"
          if [ "$code" = "503" ] || grep -q 'locked until' /tmp/gate.html; then
            echo "::error title=Tester key not bound::The test site is still locked. TESTER_PASSKEY is missing from the live Worker version."
            exit 1
          fi
          if [ "$code" != "401" ] || ! grep -q '__tester' /tmp/gate.html; then
            echo "::error title=Unexpected gate status::Expected the tester key page (401), got $code."
            exit 1
          fi
