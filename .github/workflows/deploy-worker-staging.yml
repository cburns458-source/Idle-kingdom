name: Deploy Worker (staging)

# Separate Worker and hostname from production. Never runs `wrangler deploy`
# without --env staging, so it cannot publish to restoria-idlerpg /
# restoriaidle.com.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: worker-staging
  cancel-in-progress: false

jobs:
  staging:
    name: restoria-idlerpg-staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77df1b8f6f00664859462a7a8b4441f5
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy staging Worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning title=Staging Worker deploy skipped::Set the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts Edit + Zone DNS Edit) to deploy restoria-idlerpg-staging."
            exit 0
          fi
          npx --yes wrangler@4.148.0 deploy --env staging
