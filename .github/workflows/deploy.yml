name: Deploy

# Edge functions only. The database is applied through the Supabase
# connection (test project first, live at ship). See docs/deployment.md.
#
# test-launch → GitHub environment `staging` → Restoria test
# main        → GitHub environment `production` → live project
#
# The job fails when the environment is missing SUPABASE_ACCESS_TOKEN or
# SUPABASE_PROJECT_REF. A silent skip used to report success while the
# live bazaar function stayed on a September build.
# Test ref is xlbwmxxtzrqjujvgqcuf (letter l after x, not the digit 1).

on:
  push:
    branches: [test-launch, main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time per site. Never cancel one halfway: a function that
# has been uploaded but not switched over is worse than a queued deploy.
concurrency:
  group: supabase-functions-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  functions:
    name: Supabase edge functions
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Deploying a function that does not compile would leave the Bazaar
      # refusing every offer, and the failure would only show up as a 500 in a
      # player's face. Cheap enough to repeat here rather than trust the run on
      # the merge commit.
      - run: deno check */index.ts
        working-directory: supabase/functions

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm environment
        run: |
          echo "branch=$GITHUB_REF"
          echo "project_ref_set=$([ -n "$SUPABASE_PROJECT_REF" ] && echo yes || echo no)"
          echo "access_token_set=$([ -n "$SUPABASE_ACCESS_TOKEN" ] && echo yes || echo no)"
          echo "project_ref_chars=${#SUPABASE_PROJECT_REF}"

      - name: Deploy
        run: |
          # Secrets pasted from a table or chat often include a newline in
          # the middle of https://….supabase.co. Join whitespace, then
          # accept either a bare ref or that URL.
          ref="$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '\r\n[:space:]')"
          ref="${ref#https://}"
          ref="${ref%.supabase.co}"
          ref="${ref%%/*}"
          token="${SUPABASE_ACCESS_TOKEN%%$'\n'*}"
          token="${token%%$'\r'*}"
          export SUPABASE_ACCESS_TOKEN="$token"
          export SUPABASE_PROJECT_REF="$ref"
          echo "normalized_ref_chars=${#ref}"
          if [ "$ref" = "xlbwmxxtzrqjujvgqcuf" ]; then
            echo "normalized_ref_is=test"
          elif [ "$ref" = "fxcovagwwbptqaavispl" ]; then
            echo "normalized_ref_is=live"
          elif [ "$ref" = "gncevapkklzyyfckappn" ]; then
            echo "normalized_ref_is=org"
          else
            echo "normalized_ref_is=other"
          fi
          if [ -z "$token" ] || [ -z "$ref" ]; then
            echo "::error title=Deploy secrets missing::Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF on the GitHub environment for this branch (staging for test-launch, production for main)."
            exit 1
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error title=Invalid project ref::staging SUPABASE_PROJECT_REF must be exactly xlbwmxxtzrqjujvgqcuf (no URL, no key, no quotes). production must be fxcovagwwbptqaavispl."
            exit 1
          fi
          # Refuse a crossed wire: test-launch must never publish to live,
          # and main must never publish to the test project.
          if [ "$GITHUB_REF" = "refs/heads/test-launch" ] && [ "$ref" = "fxcovagwwbptqaavispl" ]; then
            echo "::error title=Wrong project::staging SUPABASE_PROJECT_REF is the live project. Set it to the Restoria test ref (xlbwmxxtzrqjujvgqcuf)."
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$ref" = "xlbwmxxtzrqjujvgqcuf" ]; then
            echo "::error title=Wrong project::production SUPABASE_PROJECT_REF is the test project. Set it to the live ref (fxcovagwwbptqaavispl)."
            exit 1
          fi
          # Every function, not just the changed one, so what is deployed matches
          # what is committed. verify_jwt comes from supabase/config.toml, which
          # is why this runs from the repo root.
          supabase functions deploy --project-ref "$ref"
