name: Deploy

# Edge functions only, and only from the branch the test launch is played from.
#
# The database is deliberately not here. `supabase db push` decides what to apply
# from a tracking table that migrations pasted into the SQL editor never touched,
# so on this project it would try to replay `001` onward, and the early ones
# create policies without guards and would fail. Applying a migration stays a
# deliberate step; see docs/bazaar-api.md and the note in AGENTS.md.

on:
  push:
    branches: [test-launch]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a function that has been
# uploaded but not switched over is worse than a queued deploy.
concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  functions:
    name: Supabase edge functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Deploying a function that does not compile would leave the Bazaar
      # refusing every offer, and the failure would only show up as a 500 in a
      # player's face. Cheap enough to repeat here rather than trust the run on
      # the merge commit.
      - run: deno check supabase/functions/*/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Skips rather than fails while the secrets are unset, so adding this
      # workflow does not put a red cross on every push before the project is
      # wired up.
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning title=Deploy skipped::Set the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets to deploy edge functions."
            exit 0
          fi
          # Every function, not just the changed one, so what is deployed matches
          # what is committed. verify_jwt comes from supabase/config.toml, which
          # is why this runs from the repo root.
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
