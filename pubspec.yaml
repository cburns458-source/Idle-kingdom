name: idle_kingdoms_workspace
publish_to: none

# Pub workspace root. The client and the rules packages share one lockfile, and
# read their content from the same content/ directory the TypeScript rules do.
environment:
  sdk: ^3.13.0

workspace:
  - app_flutter
  - packages/ik_parity
  - packages/ik_rules
  - packages/ik_content
  - packages/ik_runtime
  - packages/ik_net
  - packages/ik_bot
