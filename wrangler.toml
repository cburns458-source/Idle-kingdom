# Bare `npx wrangler deploy` (no --env) targets this sink Worker — NOT live.
# Feature agents that forget --env staging must not overwrite restoriaidle.com.
# Live:   npx wrangler deploy --env production   (or npm run deploy:production)
# Test:   npx wrangler deploy --env staging      (or npm run deploy:staging)
name = "restoria-idlerpg-do-not-deploy"
account_id = "77df1b8f6f00664859462a7a8b4441f5"
compatibility_date = "2026-08-17"

[build]
command = "bash scripts/cf-build.sh"

[assets]
directory = "./app_flutter/build/web"
not_found_handling = "single-page-application"

# Live Worker: restoria-idlerpg, published from `main`.
# Deploy with: npx wrangler deploy --env production
# Hostnames: restoriaidle.com / www (dashboard bindings) and
# restoria-idlerpg.cburns458.workers.dev
#
# Live custom domains are bound in the Cloudflare dashboard. Do not list
# them here: a deploy that declared those routes would rewrite the bindings.
[env.production]
name = "restoria-idlerpg"

[env.production.assets]
directory = "./app_flutter/build/web"
not_found_handling = "single-page-application"

# Test Worker: restoria-idlerpg-staging, published from `test-launch`.
# Deploy with: npx wrangler deploy --env staging
# Hostnames: test.restoriaidle.com and restoria-idlerpg-staging.cburns458.workers.dev
[env.staging]
name = "restoria-idlerpg-staging"
workers_dev = true
# Tester gate. Needs the TESTER_PASSKEY secret on this Worker; without it
# the test site shows a locked page. The live Worker has no script.
main = "src/worker/staging.ts"

[env.staging.assets]
directory = "./app_flutter/build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.staging.routes]]
pattern = "test.restoriaidle.com"
custom_domain = true

[env.staging.vars]
ENVIRONMENT = "staging"
